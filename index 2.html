<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d6efd">

    <title>Мой блокнот</title>

    <link rel="manifest"
          href="manifest.json">

    <link rel="apple-touch-icon"
          href="icon-192.png">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: #f5f5f5;
            overflow-x: hidden;
        }

        .app-header {
            background: #0d6efd;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        .content {
            padding: 15px;
            padding-bottom: 90px;
        }

        .section-card {
            position: relative;
            cursor: pointer;
            min-height: 85px;
            margin-bottom: 12px;
            border-radius: 12px;
            transition: transform 0.1s;
        }

        .section-card:active {
            transform: scale(0.98);
        }

        .letter {
            font-size: 30px;
            font-weight: bold;
            color: #0d6efd;
            width: 45px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 500;
            padding-right: 45px;
        }

        .delete-button {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #dc3545;
            font-size: 22px;
            z-index: 10;
        }

        .bottom-buttons {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 10px;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.15);
            z-index: 100;
        }

        .editor-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        #noteText {
            min-height: 55vh;
            resize: vertical;
        }

        #editorScreen {
            display: none;
        }

    </style>

</head>


<body>


<!-- ========================= -->
<!-- ГЛАВНЫЙ ЭКРАН -->
<!-- ========================= -->

<div id="mainScreen">

    <div class="app-header">
        Мой блокнот
    </div>


    <div class="content">

        <div id="sectionList"></div>

    </div>


    <div class="bottom-buttons">

        <div class="d-flex gap-2">

            <button
                class="btn btn-primary flex-fill"
                onclick="addSection()">

                + Добавить

            </button>


            <button
                class="btn btn-secondary"
                onclick="exportJSON()">

                Экспорт

            </button>


            <button
                class="btn btn-success"
                onclick="document.getElementById('fileInput').click()">

                Импорт

            </button>

        </div>


        <input
            type="file"
            id="fileInput"
            accept=".json"
            style="display:none"
            onchange="importJSON(event)">

    </div>

</div>
<!-- ========================= -->
<!-- ЭКРАН РЕДАКТИРОВАНИЯ -->
<!-- ========================= -->

<div id="editorScreen">

    <div class="app-header">

        <div class="d-flex align-items-center">

            <button
                class="btn btn-light me-3"
                onclick="showMainScreen()">

                ←

            </button>

            <span id="editorHeader">
                Раздел
            </span>

        </div>

    </div>


    <div class="content">


        <div class="editor-title">

            <span id="editorLetter"></span>

            <span> — </span>

            <span id="editorTitleDisplay">
                Новый раздел
            </span>

        </div>


        <!-- Название -->

        <label class="form-label">
            Название раздела
        </label>

        <input
            type="text"
            id="sectionTitleInput"
            class="form-control mb-3"
            placeholder="Введите название">


        <!-- Текст -->

        <label class="form-label">
            Запись
        </label>

        <textarea
            id="noteText"
            class="form-control"
            placeholder="Введите текст..."></textarea>


        <div class="d-grid gap-2 mt-3">

            <button
                class="btn btn-primary btn-lg"
                onclick="saveSection()">

                Сохранить

            </button>


            <button
                class="btn btn-outline-danger"
                onclick="clearSection()">

                Очистить содержимое

            </button>

        </div>

    </div>

</div>



<script>

/* ==================================================
   INDEXED DB
   ================================================== */

const DB_NAME = "NotebookDB";

const DB_VERSION = 1;

const STORE_NAME = "sections";

let db;

let currentSectionId = null;

/* ==================================================
   ОТКРЫТИЕ БАЗЫ
   ================================================== */

function openDatabase() {

    const request =
        indexedDB.open(DB_NAME, DB_VERSION);


    request.onupgradeneeded = function(event) {

        db = event.target.result;


        if (!db.objectStoreNames.contains(STORE_NAME)) {

            db.createObjectStore(
                STORE_NAME,
                {
                    keyPath: "id",
                    autoIncrement: true
                }
            );

        }

    };


    request.onsuccess = function(event) {

        db = event.target.result;

        loadSections();

    };


    request.onerror = function() {

        alert("Ошибка открытия базы данных");

    };

}
/* ==================================================
   АЛФАВИТ
   ================================================== */

const alphabet = [

    "А","Б","В","Г","Д","Е","Ё",
    "Ж","З","И","Й","К","Л","М",
    "Н","О","П","Р","С","Т","У",
    "Ф","Х","Ц","Ч","Ш","Щ","Ъ",
    "Ы","Ь","Э","Ю","Я"

];
/* ==================================================
   ЗАГРУЗКА КАРТОЧЕК
   ================================================== */

function loadSections() {

    const transaction =
        db.transaction(
            STORE_NAME,
            "readonly"
        );

    const store =
        transaction.objectStore(STORE_NAME);


    const request =
        store.getAll();


    request.onsuccess = function() {

        const sections = request.result;

        renderSections(sections);

    };

}
/* ==================================================
   ПОКАЗ КАРТОЧЕК
   ================================================== */

function renderSections(sections) {

    const container =
        document.getElementById("sectionList");


    container.innerHTML = "";


    sections.forEach(function(section) {


        const card =
            document.createElement("div");


        card.className =
            "card section-card shadow-sm";


        card.onclick = function() {

            openSection(section.id);

        };


        card.innerHTML = `

            <div class="card-body d-flex align-items-center">

                <div class="letter">

                    ${section.letter}

                </div>


                <div class="section-title flex-grow-1">

                    ${escapeHTML(section.title)}

                </div>


                <button
                    class="delete-button"
                    onclick="deleteSection(event, ${section.id})">

                    🗑️

                </button>

            </div>

        `;


        container.appendChild(card);

    });


    /*
       Если карточек пока нет
    */

    if (sections.length === 0) {

        container.innerHTML = `

            <div class="text-center text-muted mt-5">

                <div style="font-size:50px;">
                    📖
                </div>

                <p>
                    Блокнот пока пуст
                </p>

                <p>
                    Нажмите «Добавить»
                </p>

            </div>

        `;

    }

}
/* ==================================================
   ДОБАВЛЕНИЕ РАЗДЕЛА
   ================================================== */

function addSection() {


    const usedLetters =
        [];


    const transaction =
        db.transaction(
            STORE_NAME,
            "readonly"
        );


    const store =
        transaction.objectStore(STORE_NAME);


    const request =
        store.getAll();


    request.onsuccess = function() {

        request.result.forEach(function(section) {

            usedLetters.push(section.letter);

        });


        /*
           Ищем первую свободную букву
        */

        const freeLetter =
            alphabet.find(function(letter) {

                return !usedLetters.includes(letter);

            });


        if (!freeLetter) {

            alert("Все буквы уже используются");

            return;

        }


        currentSectionId = null;


        document.getElementById(
            "editorLetter"
        ).textContent = freeLetter;


        document.getElementById(
            "editorHeader"
        ).textContent =
            "Новый раздел";


        document.getElementById(
            "editorTitleDisplay"
        ).textContent =
            "Новый раздел";


        document.getElementById(
            "sectionTitleInput"
        ).value = "";


        document.getElementById(
            "noteText"
        ).value = "";


        showEditorScreen();

    };

}
/* ==================================================
   ОТКРЫТИЕ РАЗДЕЛА
   ================================================== */

function openSection(id) {


    const transaction =
        db.transaction(
            STORE_NAME,
            "readonly"
        );


    const store =
        transaction.objectStore(STORE_NAME);


    const request =
        store.get(id);


    request.onsuccess = function() {

        const section =
            request.result;


        if (!section) {

            return;

        }


        currentSectionId =
            section.id;


        document.getElementById(
            "editorLetter"
        ).textContent =
            section.letter;


        document.getElementById(
            "editorHeader"
        ).textContent =
            section.letter;


        document.getElementById(
            "editorTitleDisplay"
        ).textContent =
            section.title || "Без названия";


        document.getElementById(
            "sectionTitleInput"
        ).value =
            section.title || "";


        document.getElementById(
            "noteText"
        ).value =
            section.content || "";


        showEditorScreen();

    };

}
/* ==================================================
   СОХРАНЕНИЕ
   ================================================== */

function saveSection() {


    const title =
        document.getElementById(
            "sectionTitleInput"
        ).value.trim();


    const content =
        document.getElementById(
            "noteText"
        ).value;


    const letter =
        document.getElementById(
            "editorLetter"
        ).textContent;


    if (!title) {

        alert("Введите название раздела");

        return;

    }


    const transaction =
        db.transaction(
            STORE_NAME,
            "readwrite"
        );


    const store =
        transaction.objectStore(STORE_NAME);


    /*
       Новый раздел
    */

    if (currentSectionId === null) {

        store.add({

            letter: letter,

            title: title,

            content: content

        });

    }

    /*
       Редактирование существующего
    */

    else {

        store.put({

            id: currentSectionId,

            letter: letter,

            title: title,

            content: content

        });

    }


    transaction.oncomplete = function() {

        alert("Сохранено");

        showMainScreen();

        loadSections();

    };

}
/* ==================================================
   ОЧИСТКА СОДЕРЖИМОГО
   ================================================== */

function clearSection() {


    if (
        !confirm(
            "Очистить содержимое этой записи?"
        )
    ) {

        return;

    }


    document.getElementById(
        "noteText"
    ).value = "";

}
/* ==================================================
   УДАЛЕНИЕ КАРТОЧКИ
   ================================================== */

function deleteSection(event, id) {


    /*
       Не открываем карточку
       при нажатии на корзину
    */

    event.stopPropagation();


    if (
        !confirm(
            "Удалить этот раздел?"
        )
    ) {

        return;

    }


    const transaction =
        db.transaction(
            STORE_NAME,
            "readwrite"
        );


    const store =
        transaction.objectStore(STORE_NAME);


    store.delete(id);


    transaction.oncomplete = function() {

        loadSections();

    };

}
/* ==================================================
   ЭКРАНЫ
   ================================================== */

function showEditorScreen() {

    document.getElementById(
        "mainScreen"
    ).style.display = "none";


    document.getElementById(
        "editorScreen"
    ).style.display = "block";

}



function showMainScreen() {

    document.getElementById(
        "editorScreen"
    ).style.display = "none";


    document.getElementById(
        "mainScreen"
    ).style.display = "block";


    loadSections();

}
/* ==================================================
   ЭКСПОРТ JSON
   ================================================== */

function exportJSON() {


    const transaction =
        db.transaction(
            STORE_NAME,
            "readonly"
        );


    const store =
        transaction.objectStore(STORE_NAME);


    const request =
        store.getAll();


    request.onsuccess = function() {


        const data = {

            version: 1,

            sections: request.result

        };


        const json =
            JSON.stringify(
                data,
                null,
                2
            );


        const blob =
            new Blob(
                [json],
                {
                    type:
                        "application/json"
                }
            );


        const url =
            URL.createObjectURL(blob);


        const a =
            document.createElement("a");


        a.href = url;

        a.download =
            "NotebookBackup.json";


        a.click();


        URL.revokeObjectURL(url);

    };

}
/* ==================================================
   ИМПОРТ JSON
   ================================================== */

function importJSON(event) {


    const file =
        event.target.files[0];


    if (!file) {

        return;

    }


    const reader =
        new FileReader();


    reader.onload = function() {


        try {


            const data =
                JSON.parse(
                    reader.result
                );


            if (
                !data.sections ||
                !Array.isArray(data.sections)
            ) {

                alert(
                    "Неверный формат JSON"
                );

                return;

            }


            if (
                !confirm(
                    "Импорт заменит текущие записи. Продолжить?"
                )
            ) {

                return;

            }


            const transaction =
                db.transaction(
                    STORE_NAME,
                    "readwrite"
                );


            const store =
                transaction.objectStore(STORE_NAME);


            /*
               Сначала очищаем базу
            */

            const clearRequest =
                store.clear();


            clearRequest.onsuccess =
                function() {


                    data.sections.forEach(
                        function(section) {


                            store.add({

                                letter:
                                    section.letter,

                                title:
                                    section.title,

                                content:
                                    section.content

                            });


                        }
                    );

                };


            transaction.oncomplete =
                function() {

                    alert(
                        "Данные импортированы"
                    );

                    loadSections();

                };


        }

        catch(error) {

            alert(
                "Ошибка чтения JSON"
            );

        }

    };


    reader.readAsText(file);


    /*
       Позволяет повторно выбрать
       тот же файл
    */

    event.target.value = "";

}
/* ==================================================
   ЗАЩИТА ОТ HTML В НАЗВАНИЯХ
   ================================================== */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}
/* ==================================================
   PWA
   ================================================== */

if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        function() {

            navigator.serviceWorker.register(
                "service-worker.js"
            );

        }
    );

}

/* ==================================================
   ЗАПУСК
   ================================================== */

openDatabase();

     </script>

  </body>

</html>
