  <!DOCTYPE html>
  <html lang="ru">
  <head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS навигатор</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>

  body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f8f9fa;
}


.panel {
  padding: 10px;
}


#addressInput {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  font-size: 16px;
  margin-bottom: 8px;
}


#targetButton {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  margin-bottom: 8px;
}


#info {
  background: white;
  padding: 12px;
  border-radius: 8px;
  line-height: 1.6;
}


#map {
  width: 100%;
  height: 70vh;
}
  </style>
  </head>
  <body>
  <div class="panel">

    <input
      id="addressInput"
      type="text"
      placeholder="Введите адрес цели"
    >

    <button id="targetButton">
      Установить цель
    </button>

    <div id="info">
      Получаем текущую геопозицию...
    </div>

  </div>


  <div id="map"></div>


  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

  

</body>

<script>

// ================================================== // ОСНОВНЫЕ ПЕРЕМЕННЫЕ // ==================================================
let map;
let startPoint = null;
let targetPoint = null;
let currentPosition = null;
let startMarker = null;
let targetMarker = null;
let currentMarker = null;
let previousPosition = null;
let watchId = null;
// ================================================== // СОЗДАЁМ КАРТУ // ==================================================
map = L.map("map").setViev([20, 0],2);
L.tileLayer( "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap contributors" } ).addTo(map);
// ================================================== // КНОПКА УСТАНОВКИ ЦЕЛИ // ==================================================
document .getElementById("targetButton") .addEventListener( "click", setTarget );
// ================================================== // GPS // ==================================================
if ("geolocation" in navigator) {
watchId = navigator.geolocation.watchPosition(
  function(pos) {

    const latitude =
      pos.coords.latitude;

    const longitude =
      pos.coords.longitude;


    const newPosition = [
      latitude,
      longitude
    ];


    // ------------------------------------------
    // ТЕКУЩАЯ ПОЗИЦИЯ
    // ------------------------------------------

    currentPosition =
      newPosition;


    // ------------------------------------------
    // ТОЧКА A
    // ------------------------------------------

    if (!startPoint) {

      startPoint =
        [...currentPosition];


      startMarker =
        L.marker(startPoint)
          .addTo(map)
          .bindPopup(
            "Точка A — старт"
          );


      map.flyTo(
        startPoint,
        16, {
        duration: 3
      });


      document.getElementById(
        "info"
      ).innerText =
        "Точка A установлена. " +
        "Введите адрес цели.";

    }


    // ------------------------------------------
    // ТЕКУЩАЯ ТОЧКА
    // ------------------------------------------

    if (!currentMarker) {

      currentMarker =
        L.circleMarker(
          currentPosition,
          {
            radius: 8
          }
        ).addTo(map);

    } else {

      currentMarker.setLatLng(
        currentPosition
      );

    }


    // ------------------------------------------
    // ОПРЕДЕЛЯЕМ НАПРАВЛЕНИЕ ДВИЖЕНИЯ
    // ------------------------------------------

    let movementBearing = null;


    if (previousPosition) {

      const distanceMoved =
        calculateDistance(
          previousPosition,
          currentPosition
        );


      if (distanceMoved >= 5) {

        movementBearing =
          calculateBearing(
            previousPosition,
            currentPosition
          );

      }

    }


    // ------------------------------------------
    // СОХРАНЯЕМ ПОЗИЦИЮ
    // ------------------------------------------

    previousPosition =
      [...currentPosition];


    // ------------------------------------------
    // ЕСЛИ ЦЕЛЬ УСТАНОВЛЕНА
    // ------------------------------------------

    if (targetPoint) {

      updateNavigation(
        movementBearing
      );

    }

  },


  function(error) {

    document.getElementById(
      "info"
    ).innerText =
      "Ошибка GPS: " +
      error.message;

  },


  {
    enableHighAccuracy: true,
    maximumAge: 2000,
    timeout: 10000
  }

);
} else {
document.getElementById( "info" ).innerText = "Ваш браузер не поддерживает GPS.";
}
// ================================================== // УСТАНОВКА ТОЧКИ B // ==================================================
async function setTarget() {
const address = document .getElementById("addressInput") .value .trim();
if (!address) {
alert(
  "Введите адрес."
);

return;
}
if (!startPoint) {
alert(
  "Ожидаем получение текущей геопозиции."
);

return;
}
try {
// --------------------------------------------
// ПОИСК АДРЕСА
// --------------------------------------------

const url =
  "https://nominatim.openstreetmap.org/search" +


"?format=json" +
  "&limit=1" +
  "&q=" +
  encodeURIComponent(address);


const response =
  await fetch(url);


const data =
  await response.json();


if (!data.length) {

  alert(
    "Адрес не найден."
  );

  return;

}


// --------------------------------------------
// КООРДИНАТЫ ТОЧКИ B
// --------------------------------------------

const latitude =
  parseFloat(
    data[0].lat
  );


const longitude =
  parseFloat(
    data[0].lon
  );


targetPoint = [
  latitude,
  longitude
];


// --------------------------------------------
// УДАЛЯЕМ СТАРУЮ ТОЧКУ B
// --------------------------------------------

if (targetMarker) {

  map.removeLayer(
    targetMarker
  );

}


// --------------------------------------------
// СОЗДАЁМ ТОЧКУ B
// --------------------------------------------

targetMarker =
  L.marker(targetPoint)
    .addTo(map)
    .bindPopup(
      "Точка B — цель"
    )
    .openPopup();


// --------------------------------------------
// ПОКАЗЫВАЕМ A И B
// --------------------------------------------

const bounds =
  L.latLngBounds(
    startPoint,
    targetPoint
  );


map.fitBounds(
  bounds,
  {
    padding: [40, 40]
  }
);


document.getElementById(
  "info"
).innerText =
  "Цель установлена.";
}
catch (error) {
console.error(error);


alert(
  "Ошибка при поиске адреса."
);
}
}
// ================================================== // НАВИГАЦИЯ // ==================================================
function updateNavigation( movementBearing ) {
if ( !currentPosition || !targetPoint ) {
return;
}
// -------------------------------------------- // РАССТОЯНИЕ ДО ЦЕЛИ // --------------------------------------------
const distance = calculateDistance( currentPosition, targetPoint );
// -------------------------------------------- // НАПРАВЛЕНИЕ НА ЦЕЛЬ // --------------------------------------------
const targetBearing = calculateBearing( currentPosition, targetPoint );
// -------------------------------------------- // НАПРАВЛЕНИЕ ЕЩЁ НЕ ОПРЕДЕЛЕНО // --------------------------------------------
if ( movementBearing === null ) {
document.getElementById(
  "info"
).innerHTML =

  "До цели: " +
  formatDistance(distance) +

  "<br>" +

  "Определяем направление движения...";

return;
}
// -------------------------------------------- // РАЗНИЦА НАПРАВЛЕНИЙ // --------------------------------------------
const difference = angleDifference( movementBearing, targetBearing );
// -------------------------------------------- // ПОЛОЖЕНИЕ ЦЕЛИ // --------------------------------------------
let directionText;
if (difference <= 20) {
directionText =
  "Цель прямо по курсу";
}
else if (difference < 120) {
directionText =
  "Цель впереди правее";
}
else if (difference < 240) {
directionText =
  "Цель впереди левее";
}
else {
directionText =
  "Цель впереди правее";
}
// -------------------------------------------- // ИНФОРМАЦИЯ // --------------------------------------------
document.getElementById( "info" ).innerHTML =
"До цели: " +
formatDistance(distance) +

"<br>" +

directionText +

"<br>" +

"Направление движения: " +
Math.round(movementBearing) +
"°" +

"<br>" +

"Направление на цель: " +
Math.round(targetBearing) +
"°";
}
// ================================================== // РАССТОЯНИЕ // ==================================================
function calculateDistance( point1, point2 ) {
const R = 6371000;
const lat1 = point1[0] * Math.PI / 180;
const lat2 = point2[0] * Math.PI / 180;
const deltaLat = (point2[0] - point1[0]) * Math.PI / 180;
const deltaLng = (point2[1] - point1[1]) * Math.PI / 180;
const a =
Math.sin(deltaLat / 2) *
Math.sin(deltaLat / 2) +

Math.cos(lat1) *
Math.cos(lat2) *

Math.sin(deltaLng / 2) *
Math.sin(deltaLng / 2);
const c = 2 * Math.atan2( Math.sqrt(a), Math.sqrt(1 - a) );
return R * c;
}

// НАПРАВЛЕНИЕ МЕЖДУ ДВУМЯ ТОЧКАМИ

// ==================================================

function calculateBearing(

  point1,

  point2

) {

  const lat1 =

    point1[0] *

    Math.PI /

    180;

  const lat2 =

    point2[0] *

    Math.PI /

    180;

  const deltaLng =

    (point2[1] - point1[1]) *

    Math.PI /

    180;

  const y =

    Math.sin(deltaLng) *

    Math.cos(lat2);

  const x =

    Math.cos(lat1) *

    Math.sin(lat2) -

    Math.sin(lat1) *

    Math.cos(lat2) *

    Math.cos(deltaLng);

  let bearing =

    Math.atan2(y, x) *

    180 /

    Math.PI;

  bearing =

    (bearing + 360) % 360;

  return bearing;

}

// ==================================================

// РАЗНИЦА УГЛОВ

// ==================================================

function angleDifference(

  angle1,

  angle2

) {

  let difference =

    Math.abs(

      angle1 - angle2

    );

  if (difference > 180) {

    difference =

      360 - difference;

  }

  return difference;

}

// ==================================================

// ФОРМАТ РАССТОЯНИЯ

// ==================================================

function formatDistance(

  meters

) {

  if (meters < 1000) {

    return (

      Math.round(meters) +

      " м"

    );

  }

  return (

    (meters / 1000).toFixed(2) +
     " км"
   );
 }

 </script>
 </body>
 </html>
