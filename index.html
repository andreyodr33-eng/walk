<!Doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>PWA Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="manifest" href="manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      .search-box {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 10px);

        left: 10px;
        right: 10px;

        display: flex;
        gap: 10px;

        z-index: 5000;
      }

      .search-box input {
        flex: 1;
        min-width: 0;
        padding: 12px;
        font-size: 16px;
        border: none;
        border-radius: 10px;
      }

      .search-box button {
        padding: 12px;

        border: none;
        border-radius: 10px;
        font-size: 16px;
        background: #1e88e5;
        color: white;
      }
      #map {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      #routeInfo {
        position: fixed;

        bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);

        left: 50%;

        transform: translateX(-50%);

        z-index: 5000;

        background: rgba(0, 0, 0, 0.75);

        backdrop-filter: blur(8px);

        color: white;

        padding: 12px 18px;

        border-radius: 14px;

        font-size: 22px;

        font-weight: bold;

        white-space: nowrap;
      }

      #historyMenu {
        position: fixed;

        top: 80px;
        left: 10px;
        right: 10px;

        z-index: 6000;

        background: white;

        border-radius: 12px;

        padding: 10px;

        display: none;

        max-height: 300px;

        overflow-y: auto;

        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }

      .historyItem {
        padding: 10px;

        border-bottom: 1px solid #ddd;

        margin-bottom: 8px;
      }

      .historyButtons {
        display: flex;

        gap: 8px;

        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div class="search-box">
      <div id="historyMenu"></div>
      <div id="routeInfo">0 км : 0 мин</div>
      <input type="text" id="addressInput" placeholder="Введите адрес" />

      <button onclick="setTargetAddress()">Поиск</button>

      <button onclick="toggleHistory()">История</button>
    </div>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"
    />
    <script>
      let map = L.map("map", {
        zoomControl: false,
      }).setView([0, 0], 2);

      L.tileLayer("https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png", {
        maxZoom: 19,
      }).addTo(map);
      let currentMarker = null;
      let routingControl = null;
      let targetPoint = null;
      let targetMarker = null;
      let targetLine = null;
      let userTrack = [];
      let userTrackLine = null;
      let smoothPoints = [];
      const SMOOTH_SIZE = 5;
      let currentPosition = null;
      let watchId = null;
      let routeHistory = JSON.parse(localStorage.getItem("routeHistory")) || [];
      let firstUpdate = true;

      userTrackLine = L.polyline([], {
        color: "red",
        weight: 6,
      }).addTo(map);

      async function setTargetAddress() {
        const address = document.getElementById("addressInput").value;

        if (!address) {
          return;
        }

        const response = await fetch(
          `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`,
        );

        const data = await response.json();

        if (!data.length) {
          alert("Адрес не найден");
          return;
        }

        const lat = parseFloat(data[0].lat);
        const lng = parseFloat(data[0].lon);

        targetPoint = [lat, lng];

        // marker цели
        if (targetMarker) {
          map.removeLayer(targetMarker);
        }

        targetMarker = L.marker(targetPoint).addTo(map);

        alert("Цель установлена");
        buildRoute();
      }
      function buildRoute() {
        if (!targetPoint || !currentPosition) {
          return;
        }

        // если уже был маршрут — удалить
        if (routingControl) {
          map.removeControl(routingControl);
        }

        navigator.geolocation.getCurrentPosition((pos) => {
          const start = currentPosition;

          routingControl = L.Routing.control({
            router: L.Routing.osrmv1({
              profile: "car",
            }),

            waypoints: [
              L.latLng(start[0], start[1]),
              L.latLng(targetPoint[0], targetPoint[1]),
            ],

            lineOptions: {
              styles: [
                {
                  color: "blue",
                  weight: 6,
                },
              ],
            },

            routeWhileDragging: false,
            addWaypoints: false,
            draggableWaypoints: false,
            fitSelectedRoutes: true,
            show: false,
          }).addTo(map);

          routingControl.on("routesfound", function (e) {
            const route = e.routes[0];

            const distanceKm = (route.summary.totalDistance / 1000).toFixed(1);

            const timeMin = Math.round(route.summary.totalTime / 60);

            document.getElementById("routeInfo").innerText =
              distanceKm + " км • " + timeMin + " мин";
            saveRouteHistory(
              document.getElementById("addressInput").value,
              distanceKm,
              timeMin,
              targetPoint,
            );
          });
        });
      }
      function saveRouteHistory(address, distance, time, point) {
        routeHistory.unshift({
          address,
          distance,
          time,
          point,
        });

        // только 5 последних
        routeHistory = routeHistory.slice(0, 5);

        localStorage.setItem("routeHistory", JSON.stringify(routeHistory));
        renderHistory();
      }
      function repeatRoute(index) {
        const item = routeHistory[index];

        document.getElementById("addressInput").value = item.address;

        targetPoint = item.point;

        if (targetMarker) {
          map.removeLayer(targetMarker);
        }

        targetMarker = L.marker(targetPoint).addTo(map);

        buildRoute();

        document.getElementById("historyMenu").style.display = "none";
      }
      function deleteRoute(index) {
        routeHistory.splice(index, 1);

        localStorage.setItem("routeHistory", JSON.stringify(routeHistory));

        renderHistory();
      }

      function toggleHistory() {
        const menu = document.getElementById("historyMenu");

        if (menu.style.display === "block") {
          menu.style.display = "none";
        } else {
          renderHistory();

          menu.style.display = "block";
        }
      }
      function renderHistory() {
        const menu = document.getElementById("historyMenu");

        menu.innerHTML = "";

        routeHistory.forEach((item, index) => {
          menu.innerHTML += `
              <div class="historyItem">

                <b>${item.address}</b><br>

                ${item.distance} км • ${item.time} мин

                <div class="historyButtons">

                  <button onclick="repeatRoute(${index})">
                    Повторить
                  </button>

                  <button onclick="deleteRoute(${index})">
                    Удалить
                  </button>

                </div>

              </div>
            `;
        });
      }
      function getSmoothedPoint(points) {
        let lat = 0;
        let lng = 0;

        for (let p of points) {
          lat += p[0];
          lng += p[1];
        }

        return [lat / points.length, lng / points.length];
      }
      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const latitude = pos.coords.latitude;
          const longitude = pos.coords.longitude;

          const currentPoint = [latitude, longitude];
          currentPosition = currentPoint;
          smoothPoints.push(currentPoint);
          if (smoothPoints.length > SMOOTH_SIZE) {
            smoothPoints.shift();
          }
          if (firstUpdate) {
            map.flyTo(currentPoint, 17);
            firstUpdate = false;
          }
          let smoothPoint = currentPoint;
          if (smoothPoints.length < 3) {
            smoothPoint = getSmoothedPoint(smoothPoints);
          }
          userTrack.push(smoothPoint);

          if (userTrackLine) {
            userTrackLine.addLatLng(smoothPoint);
          }

          if (!currentMarker) {
            currentMarker = L.marker(smoothPoint).addTo(map);
          } else {
            currentMarker.setLatLng(smoothPoint);
          }

          // линия до цели
          if (targetPoint) {
            // detectTargetDirection(currentPoint);
          }
        },
        (err) => {
          alert(err.message);
        },
        {
          enableHighAccuracy: true,
        },
      );
    </script>
  </body>
</html>
